<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Company Insights Module</title>
  <style>
    body { font-family: sans-serif; background: #f8f9fa; padding: 40px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; background: #1a73e8; color: white; border: none; cursor: pointer; }
    #result { background: #f1f3f4; padding: 20px; border-radius: 8px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Company Quick View</h2>
    <div class="search-box">
      <input type="text" id="companyInput" placeholder="Enter company name...">
      <button onclick="getCompanyData()">Search</button>
    </div>
    <div id="result">Enter a company name above to fetch live data...</div>
  </div>

  <!-- LOAD THE CONFIG FILE FIRST -->
  <script src="config.js"></script>

  <script type="module">
    import { GoogleGenAI } from "https://esm.sh/@google/genai";

    // API_KEY comes directly from config.js
    const ai = new GoogleGenAI({ apiKey: API_KEY });

    window.getCompanyData = async function() {
      const companyName = document.getElementById("companyInput").value.trim();
      const resultDiv = document.getElementById("result");
      
      if (!companyName) return;
      resultDiv.innerHTML = "Searching live web data...";

      try {
        const response = await ai.models.generateContent({
          model: "gemini-3.6-flash",
          contents: `Provide a quick view and update for: ${companyName}`,
          config: {
            systemInstruction: "You are a corporate analyst. When given a company name, provide a brief overview, recent performance/news over the last 3-6 months, and key financial highlights using HTML bullet points (<ul> and <li>).",
            tools: [{ googleSearch: {} }] 
          }
        });

        resultDiv.innerHTML = response.text;
      } catch (error) {
        console.error("Error:", error);
        resultDiv.innerHTML = "An error occurred fetching data.";
      }
    };
  </script>
</body>
</html>
